name: secret-scan

# Public site: nothing here should ever be a secret, so fail the build if one shows up.
# GitHub's native secret scanning + push protection are also on for this repo; this
# adds gitleaks over the full history on every push and PR.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned)
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar xzf gl.tgz gitleaks && sudo install -m755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: gitleaks (full history)
        run: gitleaks detect --source . --redact -v
